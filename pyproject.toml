[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smai-deblurring"
version = "0.1.0"
description = "Controlled comparison of classical and modern inverse-function learners for image deblurring"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "Pillow>=9",
]

[project.optional-dependencies]
deep = ["torch>=2.0"]
metrics = ["lpips>=0.1.4"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
